    <!-- Structured Data (Schema.org JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "DataLoom",
        "url": "https://dataloom.sohagsheik.com",
        "description": "100% Client-Side, Local-First In-Browser SQL, Large JSON/CSV & Markdown Visual Explorer powered by DuckDB-Wasm and SQLite.",
        "applicationCategory": "DeveloperApplication",
        "operatingSystem": "All modern web browsers (Chrome, Firefox, Safari, Edge)",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "In-Browser DuckDB-Wasm Engine",
          "Client-Side SQLite Support",
          "CSV and TSV Fast Ingestion with Type Inference",
          "Deeply Nested JSON / JSONL Flattening",
          "Markdown Table Extraction and Split Editor",
          "Interactive Data Grid with 60fps Virtual Scrolling",
          "Zero Uploads & 100% Local Privacy"
        ]
      }
    </script>

    <script>
      // Pre-paint theme: avoids flash / layout shift.
      (function () {
        try {
          var t = localStorage.getItem("dataloom-theme") || "system";
          var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>

  <body>
    <div id="root"></div>
